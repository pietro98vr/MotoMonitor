name: Moto Monitor

# Esecuzione automatica giornaliera + pulsante manuale.
on:
  schedule:
    - cron: "0 7 * * *"     # 07:00 UTC (~08:00/09:00 ora italiana). Modifica se vuoi.
  workflow_dispatch: {}      # avvio manuale dalla scheda "Actions"

permissions:
  contents: write            # serve per salvare state.json aggiornato nel repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python monitor.py

      - name: Salva stato e web app aggiornati
        run: |
          git config user.name "moto-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json report.md report.html docs/index.html searches.json || true
          if ! git commit -m "Aggiornamento $(date -u +%F)"; then
            echo "Nessuna modifica da salvare"; exit 0
          fi
          # Se nel frattempo il PC di casa ha pubblicato, riallinea e riprova.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            sleep 5
          done
          echo "Push non riuscito dopo 3 tentativi" && exit 1
